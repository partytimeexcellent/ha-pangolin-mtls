name: Ingress prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pangolin_access
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: pangolin_access/.node-version
          cache: npm
          cache-dependency-path: pangolin_access/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --tag ha-pangolin-prototype pangolin_access
      - name: Verify runtime and architecture
        run: docker run --rm --entrypoint node ha-pangolin-prototype -e 'if(process.versions.node!=="24.22.1")process.exit(1);console.log(process.arch)'
      - name: Verify non-root startup and direct-access denial
        run: docker run --rm --init --tmpfs /data --interactive --entrypoint node ha-pangolin-prototype --input-type=module < pangolin_access/tests/container-smoke.mjs

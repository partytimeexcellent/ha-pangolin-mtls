name: HA Pangolin Access
version: "0.1.0-dev.13"
slug: pangolin_access
description: "Create device certificates for Home Assistant access through Pangolin mTLS"
url: https://github.com/partytimeexcellent/ha-pangolin-mtls/tree/main/pangolin_access
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
init: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:shield-key-outline
panel_title: Pangolin Access
backup: cold
timeout: 120
tmpfs: true
homeassistant_api: true
options:
  admin_user_ids: []
  enable_home_assistant_notifications: false
  home_assistant_origin: ""
schema:
  enable_home_assistant_notifications: "bool?"
  admin_user_ids:
    - "match(^[a-f0-9]{32}$)"
  home_assistant_origin: "str?"

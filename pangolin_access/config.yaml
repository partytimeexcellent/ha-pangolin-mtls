name: HA Pangolin Access
version: "0.1.0-dev.1"
slug: pangolin_access
description: "Development prototype for ingress authorization; certificate signing disabled"
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
init: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:shield-key-outline
panel_title: Pangolin Access
backup: cold
timeout: 20
options:
  admin_user_ids: []
  home_assistant_origin: "http://homeassistant.local:8123"
schema:
  admin_user_ids:
    - "match(^[a-f0-9]{32}$)"
  home_assistant_origin: url

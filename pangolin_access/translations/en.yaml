configuration:
  admin_user_ids:
    name: Recovery administrator IDs (optional)
    description: >-
      Usually leave empty and set up access in the Web UI. For manual setup or recovery,
      add a trusted user's 32-character Home Assistant user ID here. These accounts retain
      access independently of the Web UI selection. Remove IDs you no longer trust.
  home_assistant_origin:
    name: Home Assistant URL override (optional)
    description: >-
      Leave blank to use Home Assistant's external URL. If you open this app at another
      address, enter that HTTPS address here, for example https://ha.example.net.
      Include a port if needed, but no path. Save and restart to apply changes.
